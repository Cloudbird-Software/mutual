version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
        cooldown-days: 7
  # PR3 收敛 Go-only（ADR-0027）：pip 面随 Python 基线移除，换 gomod。
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        cooldown-days: 7
